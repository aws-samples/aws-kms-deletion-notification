name: lint
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  cfn-lint-and-checkov:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      # Pinned versions keep results reproducible. Update them on a regular schedule.
      - run: pip install cfn-lint==1.36.1 checkov==3.4.5
      - run: cfn-lint Alerting-KMS-Events.yaml
      - run: checkov -d . --framework cloudformation
